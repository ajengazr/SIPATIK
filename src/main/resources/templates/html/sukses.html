<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E40AF">
    <title>Proses Berhasil | SIPATIK</title>
    <link rel="stylesheet" th:href="@{/css/sipatik.css}">
    <link rel="stylesheet" th:href="@{/css/sukses.css}">
</head>
<body class="success-page">
    <div class="popup-overlay" id="popupOverlay" role="dialog" aria-modal="true" aria-labelledby="success-title">
        <div class="popup-content" id="popupContent">
            <div class="popup-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25">
                    <path d="M5 12.5 9.25 16.5 19 6.75" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <p class="popup-kicker">Proses selesai</p>
            <h1 class="popup-title" id="success-title">Berhasil</h1>
            <p class="popup-message" th:text="${message}">Data berhasil diproses.</p>
            <button type="button" class="popup-button" onclick="closePopup()">Kembali ke beranda</button>
        </div>
    </div>

    <script>
        window.onload = function () {
            const overlay = document.getElementById('popupOverlay');
            const content = document.getElementById('popupContent');
            overlay.style.display = 'flex';
            setTimeout(() => content.classList.add('active'), 50);
        };

        function closePopup() {
            const content = document.getElementById('popupContent');
            content.classList.remove('active');
            setTimeout(() => {
                document.getElementById('popupOverlay').style.display = 'none';
            }, 300);
            window.location.href = '/auth/';
        }
    </script>
</body>
</html>
