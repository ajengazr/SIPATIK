<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konfirmasi Berhasil — SIPATIK</title>
    <link rel="stylesheet" th:href="@{/css/dash.css}" />
    <link rel="stylesheet" th:href="@{/css/sukses.css}" />
    <link rel="stylesheet" th:href="@{/css/sipatik.css}" />
</head>

<body class="success-page">
    <div class="popup-overlay" id="popupOverlay">
        <section class="popup-content" id="popupContent" role="dialog" aria-modal="true"
            aria-labelledby="popupTitle" aria-describedby="popupMessage">
            <div class="popup-icon" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 12.5L9.25 16.5L19 6.75" stroke="currentColor" stroke-width="2.25"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <h1 class="popup-title" id="popupTitle">Berhasil disimpan</h1>
            <p class="popup-message" id="popupMessage" th:text="${message}"></p>
            <button class="popup-button" type="button" onclick="closePopup()">Kembali ke Dashboard</button>
        </section>
    </div>

    <script>
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        window.addEventListener('load', function () {
            const overlay = document.getElementById('popupOverlay');
            const content = document.getElementById('popupContent');
            overlay.style.display = 'flex';
            if (reduceMotion) {
                content.classList.add('active');
            } else {
                window.requestAnimationFrame(() => content.classList.add('active'));
            }
            document.querySelector('.popup-button').focus();
        });

        function closePopup() {
            const content = document.getElementById('popupContent');
            content.classList.remove('active');
            window.setTimeout(() => {
                document.getElementById('popupOverlay').style.display = 'none';
                window.location.href = '/user/dash-user';
            }, reduceMotion ? 0 : 180);
        }
    </script>
</body>

</html>
