<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E40AF">
    <title>403 - Akses Ditolak | SIPATIK</title>
    <link rel="stylesheet" th:href="@{/css/sipatik.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body class="error-page">
    <a class="skip-link" href="#error-content">Lewati ke pesan kesalahan</a>
    <main class="error-shell" id="error-content">
        <section class="error-visual" aria-label="Status 403">
            <div class="error-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m6.5 6.5 11 11"/></svg>
            </div>
            <p class="error-code">403</p>
            <p class="error-status">Akses ditolak</p>
        </section>
        <section class="error-card">
            <p class="error-eyebrow">Izin tidak mencukupi</p>
            <h1 class="error-title">Halaman ini tidak dapat Anda akses</h1>
            <p class="error-message" th:text="${errorMessage ?: 'Anda tidak memiliki akses ke halaman ini'}">Anda tidak memiliki akses ke halaman ini.</p>
            <div class="error-actions">
                <a href="javascript:history.back()" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                    Kembali
                </a>
                <a href="/auth/" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                    Beranda
                </a>
            </div>
        </section>
    </main>
</body>
</html>
