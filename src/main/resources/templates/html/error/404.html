<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E40AF">
    <title>404 - Halaman Tidak Ditemukan | SIPATIK</title>
    <link rel="stylesheet" th:href="@{/css/sipatik.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body class="error-page">
    <a class="skip-link" href="#error-content">Lewati ke pesan kesalahan</a>
    <main class="error-shell" id="error-content">
        <section class="error-visual" aria-label="Status 404">
            <div class="error-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/><path d="M8.5 9.5a3 3 0 0 1 5 2c0 2-2.5 2-2.5 3"/><path d="M11 17h.01"/></svg>
            </div>
            <p class="error-code">404</p>
            <p class="error-status">Halaman tidak ditemukan</p>
        </section>
        <section class="error-card">
            <p class="error-eyebrow">Tautan tidak tersedia</p>
            <h1 class="error-title">Kami tidak menemukan halaman itu</h1>
            <p class="error-message" th:text="${errorMessage ?: 'Halaman tidak ditemukan'}">Halaman yang Anda cari tidak ditemukan.</p>
            <div class="error-actions">
                <a href="/auth/" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                    Kembali ke Beranda
                </a>
            </div>
        </section>
    </main>
</body>
</html>
