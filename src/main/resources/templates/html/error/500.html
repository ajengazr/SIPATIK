<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E40AF">
    <title>500 - Kesalahan Server | SIPATIK</title>
    <link rel="stylesheet" th:href="@{/css/sipatik.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body class="error-page">
    <a class="skip-link" href="#error-content">Lewati ke pesan kesalahan</a>
    <main class="error-shell" id="error-content">
        <section class="error-visual" aria-label="Status 500">
            <div class="error-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2.8 19a1.4 1.4 0 0 0 1.2 2h16a1.4 1.4 0 0 0 1.2-2L12 3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            </div>
            <p class="error-code">500</p>
            <p class="error-status">Gangguan server</p>
        </section>
        <section class="error-card">
            <p class="error-eyebrow">Terjadi gangguan sementara</p>
            <h1 class="error-title">Layanan belum dapat memproses permintaan</h1>
            <p class="error-message" th:text="${errorMessage ?: 'Terjadi kesalahan pada server, silakan coba lagi'}">Terjadi kesalahan pada server, silakan coba lagi.</p>
            <div class="error-actions">
                <button type="button" onclick="location.reload()" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17a8 8 0 0 0 13.7 1L20 12"/><path d="M4 12 6.3 6A8 8 0 0 1 20 7"/></svg>
                    Coba Lagi
                </button>
                <a href="/auth/" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                    Beranda
                </a>
            </div>
        </section>
    </main>
</body>
</html>
