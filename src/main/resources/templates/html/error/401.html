<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E40AF">
    <title>401 - Tidak Diizinkan | SIPATIK</title>
    <link rel="stylesheet" th:href="@{/css/sipatik.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body class="error-page">
    <a class="skip-link" href="#error-content">Lewati ke pesan kesalahan</a>
    <main class="error-shell" id="error-content">
        <section class="error-visual" aria-label="Status 401">
            <div class="error-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </div>
            <p class="error-code">401</p>
            <p class="error-status">Autentikasi diperlukan</p>
        </section>
        <section class="error-card">
            <p class="error-eyebrow">Akses belum tersedia</p>
            <h1 class="error-title">Silakan masuk terlebih dahulu</h1>
            <p class="error-message" th:text="${errorMessage ?: 'Anda perlu login untuk mengakses halaman ini'}">Anda perlu login untuk mengakses halaman ini.</p>
            <div class="error-actions">
                <a href="/auth/login" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
                    Login
                </a>
                <a href="/auth/" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                    Beranda
                </a>
            </div>
        </section>
    </main>
</body>
</html>
