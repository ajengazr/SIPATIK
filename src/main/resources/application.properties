spring.application.name=sipatik

# Profil yang dipakai bila tidak ada profil lain yang ditentukan.
# Berkas config/application-local.properties berisi kredensial pengembangan
# (database Supabase, jwt.secret) dan sengaja diletakkan di luar
# src/main/resources supaya tidak pernah ikut ter-package ke dalam jar.
#
# Di server, set SPRING_PROFILES_ACTIVE (mis. "prod") atau sediakan JWT_SECRET
# lewat environment variable. Berkas local tidak ada di sana, jadi tidak ada
# kredensial pengembangan yang terbawa.
spring.profiles.default=local
server.port=${SERVER_PORT:8080}

# ========== DATABASE CONFIGURATION (PostgreSQL) ==========
# PostgreSQL tidak punya padanan createDatabaseIfNotExist milik MySQL, jadi database
# "sipatik" harus dibuat sekali di awal (lihat README bagian Setup Database).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sipatik}
spring.datasource.username=${DB_USERNAME:sipatik}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== LOGGING ==========
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.projek.sipatik=${LOG_LEVEL_APP:INFO}

# ========== JPA / HIBERNATE CONFIG ==========
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ========== THYMELEAF CONFIG ==========
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ========== EMAIL CONFIGURATION ==========
# Kredensial SMTP diambil dari environment variable, tidak lagi ditulis di file ini.
# Sebelum menjalankan aplikasi, set MAIL_USERNAME dan MAIL_PASSWORD.
# Contoh (PowerShell):  $env:MAIL_USERNAME="akun@gmail.com"; $env:MAIL_PASSWORD="app-password"
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:fajar.rafsan02@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ovkywqsagcankgoc}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.debug=${MAIL_DEBUG:false}

# ========== JWT ==========
# Tidak ada nilai bawaan: aplikasi sengaja gagal start bila JWT_SECRET belum diisi.
jwt.secret=${JWT_SECRET}

# Cookie JWT harus Secure pada deployment HTTPS. Profil local mengubahnya menjadi
# false agar login tetap dapat diuji melalui http://localhost.
app.security.cookie-secure=${COOKIE_SECURE:true}

# Bootstrap admin dimatikan secara default. Saat diaktifkan, email dan password
# wajib diberikan melalui environment variable; tidak ada kredensial hardcoded.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.name=${APP_BOOTSTRAP_ADMIN_NAME:Bendahara Eksternal}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# ========== UPLOAD ==========
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ========== ERROR HANDLING ==========
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
