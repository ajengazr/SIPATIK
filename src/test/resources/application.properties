spring.datasource.url=jdbc:h2:mem:sipatik-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Test harus deterministik dan tidak memerlukan PostgreSQL/Supabase eksternal.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Kunci ini hanya hidup di classpath test dan tidak pernah dipakai saat aplikasi berjalan.
jwt.secret=sipatikTestOnlyJwtSecretAtLeast32BytesLong

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

logging.level.org.springframework=WARN
logging.level.com.projek.sipatik=INFO
